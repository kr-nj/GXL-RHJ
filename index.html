<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GXL ❤ RHJ 备婚待办</title>
<style>
  :root{
    --pink:#e8879c;
    --pink-soft:#f7d9e0;
    --pink-bg:#fdf3f5;
    --ink:#3a3236;
    --muted:#9a8d92;
    --line:#f0e0e5;
    --green:#6bbf8a;
    --card:#ffffff;
    --shadow:0 4px 18px rgba(211,140,160,.14);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--pink-bg);
    color:var(--ink);
    line-height:1.6;
    padding-bottom:60px;
  }
  header{
    background:linear-gradient(135deg,#f0a0b4,#e8879c);
    color:#fff;
    padding:26px 20px 22px;
    text-align:center;
    position:relative;
  }
  header h1{font-size:23px;letter-spacing:2px;}
  header .names{font-size:20px;font-weight:700;letter-spacing:1px;}
  header .date{font-size:14px;opacity:.95;margin-top:6px;}
  header .countdown{
    display:inline-block;margin-top:10px;background:rgba(255,255,255,.22);
    padding:4px 14px;border-radius:20px;font-size:13px;
  }
  header .countdown b{font-size:16px;}
  .wrap{max-width:760px;margin:0 auto;padding:0 14px;}

  /* 进度总览 */
  .overview{
    background:var(--card);
    border-radius:16px;
    box-shadow:var(--shadow);
    margin:-16px auto 18px;
    padding:18px 18px 14px;
    position:relative;
  }
  .overview h2{font-size:15px;margin-bottom:12px;color:var(--pink);}
  .bar{
    height:12px;border-radius:8px;background:var(--pink-soft);overflow:hidden;
  }
  .bar>div{
    height:100%;background:linear-gradient(90deg,#f0a0b4,#e8879c);
    width:0;transition:width .5s ease;border-radius:8px;
  }
  .bar-label{display:flex;justify-content:space-between;font-size:13px;margin-top:8px;color:var(--muted);}
  .bar-label b{color:var(--pink);font-size:15px;}

  /* Tab */
  .tabs{
    display:flex;gap:8px;overflow-x:auto;padding:4px 0 14px;
    scrollbar-width:none;
  }
  .tabs::-webkit-scrollbar{display:none;}
  .tab{
    flex:0 0 auto;padding:8px 16px;border-radius:20px;background:#fff;
    border:1px solid var(--line);color:var(--muted);font-size:14px;cursor:pointer;
    white-space:nowrap;transition:.2s;
  }
  .tab.active{background:var(--pink);color:#fff;border-color:var(--pink);box-shadow:var(--shadow);}

  .panel{display:none;animation:fade .3s;}
  .panel.active{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}

  /* 分组卡片(一级阶段) */
  .group{
    background:var(--card);border-radius:16px;box-shadow:var(--shadow);
    margin-bottom:16px;overflow:hidden;
  }
  .group-head{
    padding:14px 16px;display:flex;align-items:center;justify-content:space-between;
    user-select:none;
  }
  .group-head .title{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;flex:1;}
  .group-head .badge{
    font-size:12px;color:var(--muted);background:var(--pink-bg);
    padding:2px 10px;border-radius:12px;
  }
  .group-head .gdel{
    color:var(--muted);font-size:15px;cursor:pointer;padding:0 4px;margin-left:8px;line-height:1;
  }
  .group-body{border-top:1px solid var(--line);}

  /* 二级子分组 */
  .sub{border-top:1px solid var(--line);}
  .sub:first-child{border-top:none;}
  .sub-head{
    display:flex;align-items:center;gap:8px;padding:10px 14px;
    background:var(--pink-bg);user-select:none;
  }
  .sub-head .sub-title{flex:1;font-size:13px;font-weight:600;color:var(--pink);}
  .sub-head .badge{
    font-size:11px;color:var(--muted);background:#fff;
    padding:2px 9px;border-radius:12px;
  }
  .sub-head .sdel{color:var(--muted);font-size:14px;cursor:pointer;padding:0 4px;line-height:1;}

  .item{
    display:flex;align-items:flex-start;gap:8px;padding:12px 14px;
    border-bottom:1px solid var(--line);
  }
  .item:last-child{border-bottom:none;}
  .item .cb{
    appearance:none;width:22px;height:22px;border:2px solid var(--pink-soft);
    border-radius:50%;cursor:pointer;flex:0 0 auto;margin-top:2px;position:relative;transition:.2s;
  }
  .item .cb:checked{background:var(--green);border-color:var(--green);}
  .item .cb:checked::after{
    content:"✓";color:#fff;font-size:14px;position:absolute;
    top:50%;left:50%;transform:translate(-50%,-50%);
  }
  .item .txt{flex:1;font-size:14px;cursor:pointer;min-width:0;}
  .item .txt .note{display:block;font-size:12px;color:var(--muted);margin-top:2px;line-height:1.45;}
  .item.done .txt{color:var(--muted);text-decoration:line-through;}
  .item.done .txt .note{text-decoration:none;}
  .item .edit{
    color:#d9c2c9;font-size:14px;cursor:pointer;flex:0 0 auto;margin-top:2px;
    padding:0 2px;transition:.2s;
  }
  .item .edit:hover{color:var(--pink);}
  .item .edit.has{color:var(--pink);}
  .item .who{
    font-size:11px;padding:2px 8px;border-radius:10px;flex:0 0 auto;margin-top:1px;cursor:pointer;
  }
  .who.bride{background:#fde5ec;color:#e8879c;}
  .who.groom{background:#e2effa;color:#5b9bd5;}
  .who.both{background:#eafaf0;color:#6bbf8a;}
  .item .del{
    color:#d9c2c9;font-size:18px;cursor:pointer;flex:0 0 auto;line-height:1;margin-top:1px;
    padding:0 2px;transition:.2s;
  }
  .item .del:hover{color:var(--pink);}

  /* 添加项 */
  .additem{
    display:flex;gap:8px;padding:11px 14px;border-top:1px dashed var(--line);background:#fffafc;
  }
  .additem input{
    flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:7px 11px;font-size:14px;color:var(--ink);
  }
  .additem input:focus{outline:none;border-color:var(--pink);}
  .additem button{
    flex:0 0 auto;background:var(--pink);color:#fff;border:none;border-radius:10px;
    padding:0 16px;font-size:14px;cursor:pointer;
  }
  .addsub{
    width:calc(100% - 28px);margin:8px 14px 12px;background:#fff;border:1px dashed var(--pink-soft);
    color:var(--pink);border-radius:10px;padding:8px;font-size:13px;cursor:pointer;
  }
  .addgroup{
    width:100%;background:#fff;border:1px dashed var(--pink-soft);color:var(--pink);
    border-radius:14px;padding:12px;font-size:14px;cursor:pointer;margin-bottom:16px;
  }

  /* 预算表 */
  table{width:100%;border-collapse:collapse;font-size:14px;}
  th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line);}
  th{color:var(--pink);font-weight:600;font-size:13px;background:var(--pink-bg);}
  td.num{text-align:right;font-variant-numeric:tabular-nums;}
  .b-name{width:100%;border:none;background:transparent;font-size:14px;color:var(--ink);}
  .b-name:focus{outline:none;border-bottom:1px solid var(--pink);}
  .budget-input{
    width:82px;border:1px solid var(--line);border-radius:8px;padding:5px 8px;
    font-size:13px;text-align:right;color:var(--ink);
  }
  .budget-input:focus{outline:none;border-color:var(--pink);}
  .b-del{color:#d9c2c9;font-size:16px;cursor:pointer;text-align:center;}
  .b-del:hover{color:var(--pink);}
  tfoot td{font-weight:700;color:var(--pink);background:var(--pink-bg);}

  /* 注意事项 */
  .tip{
    background:var(--card);border-radius:14px;box-shadow:var(--shadow);
    padding:14px 16px;margin-bottom:12px;font-size:14px;border-left:4px solid var(--pink);
  }
  .tip-head{display:flex;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:4px;}
  .tip-head b{color:var(--pink);flex:1;}
  .tip-actions{flex:0 0 auto;}
  .tip-actions span{cursor:pointer;color:var(--muted);margin-left:10px;font-size:15px;line-height:1;}
  .tip-actions span:hover{color:var(--pink);}
  .tip .tip-body{color:var(--ink);}

  footer{text-align:center;color:var(--muted);font-size:12px;padding:20px;}
  .reset{
    display:inline-block;margin-top:10px;color:var(--muted);font-size:12px;
    text-decoration:underline;cursor:pointer;
  }

  /* 同步条 */
  .syncbar{
    display:flex;align-items:center;gap:8px;justify-content:center;flex-wrap:wrap;
    background:rgba(255,255,255,.18);margin-top:12px;padding:8px 12px;border-radius:14px;
  }
  .syncbar .st{font-size:12px;color:#fff;opacity:.95;display:flex;align-items:center;gap:5px;}
  .syncbar .dot{width:8px;height:8px;border-radius:50%;background:#f7d9e0;flex:0 0 auto;}
  .syncbar .dot.on{background:#8ef0b0;}
  .syncbar .dot.err{background:#ffd27a;}
  .syncbar button{
    background:rgba(255,255,255,.9);color:var(--pink);border:none;border-radius:12px;
    padding:5px 12px;font-size:12px;cursor:pointer;font-weight:600;
  }
  .syncbar button.ghost{background:rgba(255,255,255,.25);color:#fff;font-weight:500;}

  /* 弹层 */
  .modal-mask{
    position:fixed;inset:0;background:rgba(58,50,54,.45);display:none;
    align-items:center;justify-content:center;padding:20px;z-index:50;
  }
  .modal-mask.show{display:flex;}
  .modal{
    background:#fff;border-radius:18px;padding:20px 18px;max-width:340px;width:100%;
    box-shadow:0 12px 40px rgba(0,0,0,.2);
  }
  .modal h3{font-size:16px;color:var(--pink);margin-bottom:10px;}
  .modal p{font-size:13px;color:var(--ink);line-height:1.6;margin-bottom:12px;}
  .modal .code{
    background:var(--pink-bg);border:1px dashed var(--pink-soft);border-radius:10px;
    padding:10px;font-size:13px;word-break:break-all;color:var(--ink);margin-bottom:12px;
    font-family:monospace;user-select:all;
  }
  .modal input{
    width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 11px;
    font-size:14px;color:var(--ink);margin-bottom:12px;
  }
  .modal input:focus{outline:none;border-color:var(--pink);}
  .modal .row{display:flex;gap:8px;}
  .modal button{
    flex:1;border:none;border-radius:12px;padding:10px;font-size:14px;cursor:pointer;
  }
  .modal button.primary{background:var(--pink);color:#fff;}
  .modal button.sec{background:var(--pink-bg);color:var(--pink);}
  .modal .close{
    display:block;text-align:center;margin-top:6px;color:var(--muted);font-size:12px;
    cursor:pointer;text-decoration:underline;
  }
  .modal .hint{font-size:11px;color:var(--muted);line-height:1.5;margin-top:4px;}
</style>
</head>
<body>
<header>
  <h1>💍</h1>
  <div class="names">新郎 GXL ❤ 新娘 RHJ</div>
  <div class="date">婚期 2027.01.17</div>
  <div class="countdown" id="countdown"></div>
  <div class="syncbar">
    <span class="st"><span class="dot" id="syncDot"></span><span id="syncText">未同步(仅本机)</span></span>
    <button id="syncBtn">☁ 开启同步</button>
  </div>
</header>

<div class="modal-mask" id="syncModal">
  <div class="modal" id="syncModalBody"></div>
</div>

<div class="wrap">
  <div class="overview">
    <h2>整体进度</h2>
    <div class="bar"><div id="progressBar"></div></div>
    <div class="bar-label">

      <span><b id="progressPct">0%</b></span>

  <div class="tabs" id="tabs"></div>

  <div id="panels"></div>

  <footer>
    数据自动保存在本设备浏览器中 · 换设备或清缓存会丢失<br>
    点 ✎ 加备注 · 点「一起/新娘/新郎」切负责人 · 点 × 删除<br>
    <span class="reset" id="resetBtn">恢复默认清单(清空所有修改)</span>
  </footer>
</div>

function save(fromRemote){
  localStorage.setItem(STORE_KEY, JSON.stringify(store));
  // 本地改动 -> 打时间戳并推送到云端(来自远端的更新不再回推)
  if(!fromRemote){
    sync.localAt = Date.now();
    localStorage.setItem(SYNC_AT_KEY, String(sync.localAt));

/* ================= 云同步 =================
   数据保存在自己的服务器 https://one-science.cn/api/sync/wedding
   打开页面即自动同步:谁最后改以谁为准,改动后 1.2 秒推送,每 5 秒拉取一次。 */
const SYNC_API   = "https://one-science.cn/api/sync/wedding";
const SYNC_AT_KEY= "wedding_sync_at_v1";   // 本机数据最后修改时间戳

const sync = {
  localAt: Number(localStorage.getItem(SYNC_AT_KEY) || 0),
  pushTimer: null,
  pullTimer: null,
  pushing: false,
  pulling: false,
  status: "off", // off | ok | busy | err
};

function setSyncUI(status, text){
  sync.status = status;
  const dot = document.getElementById("syncDot");
  const txt = document.getElementById("syncText");
  const btn = document.getElementById("syncBtn");
  if(!dot) return;
  dot.className = "dot" + (status==="ok"?" on":status==="err"?" err":"");
  txt.textContent = text;
  btn.textContent = "☁ 同步设置";
}

// 把当前数据包装成带时间戳的信封
function envelope(){
  return { _at: sync.localAt || Date.now(), _payload: {data:store.data, budget:store.budget, tips:store.tips} };
}
// 用远端数据覆盖本地
function applyEnvelope(env){
  if(!env || !env._payload) return false;
  const p = env._payload;
  if(!p.data || !p.budget || !p.tips) return false;
  store.data = p.data; store.budget = p.budget; store.tips = p.tips;
  sync.localAt = env._at || Date.now();
  localStorage.setItem(SYNC_AT_KEY, String(sync.localAt));
  localStorage.setItem(STORE_KEY, JSON.stringify(store));
  return true;
}

// 防抖推送:改动后 1.2 秒内没有新改动才真正上传
function schedulePush(){
  clearTimeout(sync.pushTimer);
  setSyncUI("busy","保存中…");
  sync.pushTimer = setTimeout(pushNow, 1200);
}

async function pushNow(){
  if(sync.pushing) return;
  sync.pushing = true;
  try{
    const res = await fetch(SYNC_API, {
      method:"PUT",
      headers:{"Content-Type":"application/json","Accept":"application/json"},
      body: JSON.stringify(envelope()),
    });
    if(!res.ok) throw new Error("HTTP "+res.status);
    setSyncUI("ok","已同步 ✓");
  }catch(e){
    setSyncUI("err","保存失败,稍后重试");
  }finally{
    sync.pushing = false;
  }
}

// 后台拉取:发现远端更新且比本地新,就应用并重绘(除非用户正在输入)
async function pullNow(){
  if(sync.pulling) return;
  const a = document.activeElement;
  if(a && (a.tagName==="INPUT" || a.tagName==="TEXTAREA")) return;
  sync.pulling = true;
  try{
    const res = await fetch(SYNC_API, {headers:{"Accept":"application/json"}, cache:"no-store"});
    if(res.status===404){ if(sync.status!=="busy") setSyncUI("ok","已同步 ✓"); return; }
    if(!res.ok) throw new Error("HTTP "+res.status);
    const env = await res.json();
    if(env && env._at && env._at > (sync.localAt||0)){
      if(applyEnvelope(env)){ render(); }
    }
    if(sync.status!=="busy") setSyncUI("ok","已同步 ✓");
  }catch(e){
    setSyncUI("err","连接不稳,重试中");
  }finally{
    sync.pulling = false;
  }
}

function startPolling(){
  clearInterval(sync.pullTimer);
  sync.pullTimer = setInterval(pullNow, 5000);
}

/* ---------- 渲染 ---------- */
function whoLabel(w){return w==="bride"?"新娘":w==="groom"?"新郎":"一起";}
function nextWho(w){return w==="both"?"bride":w==="bride"?"groom":"both";}

function countArr(arr){ return {total:arr.length, done:arr.filter(x=>x.done).length}; }
function countGroup(g){
  let total=(g.items||[]).length, done=(g.items||[]).filter(x=>x.done).length;
  (g.subs||[]).forEach(s=>{ total+=s.items.length; done+=s.items.filter(x=>x.done).length; });
  return {total,done};
}

function render(){
  tabsEl.innerHTML = "";
  panelsEl.innerHTML = "";
  tabList.forEach(t=>{
    const label = t.label || store.data[t.id].label;
    const tab = document.createElement("div");
    tab.className = "tab" + (t.id===active?" active":"");
    tab.textContent = label;
    tab.onclick = ()=>{active=t.id;render();};
    tabsEl.appendChild(tab);

    const panel = document.createElement("div");
    panel.className = "panel" + (t.id===active?" active":"");
    if(t.id==="budget") panel.innerHTML = renderBudget();
    else if(t.id==="tips") panel.innerHTML = renderTips();
    else panel.innerHTML = renderChecklist(t.id);
    panelsEl.appendChild(panel);
  });
  bindEvents();
  updateProgress();
}

function renderItems(arr, containerId){
  const items = arr.map(it=>{
    const checked = it.done?"checked":"";
    const doneCls = it.done?" done":"";
    const note = it.note?`<span class="note">${escapeHtml(it.note)}</span>`:"";
    const editCls = it.note?"edit has":"edit";
    return `<div class="item${doneCls}">
      <input type="checkbox" class="cb" data-id="${it.id}" ${checked}>
      <span class="txt" data-toggle="${it.id}">${escapeHtml(it.t)}${note}</span>
      <span class="${editCls}" data-edit="${it.id}" title="备注">✎</span>
      <span class="who ${it.who}" data-who="${it.id}">${whoLabel(it.who)}</span>
      <span class="del" data-del="${it.id}">×</span>
    </div>`;
  }).join("");
  return items + `<div class="additem">
    <input placeholder="添加一项…" data-addinput="${containerId}">
    <button data-addbtn="${containerId}">添加</button>
  </div>`;
}

function renderChecklist(tabId){
  const groups = store.data[tabId].groups;
  const html = groups.map(g=>{
    const c = countGroup(g);
    const hasSubs = g.subs && g.subs.length;
    let body = "";
    // 直接项:有直接项时显示;没有二级分组时也显示(便于添加松散项)
    if((g.items && g.items.length) || !hasSubs){
      body += renderItems(g.items || (g.items=[]), g.id);
    }
    // 二级子分组
    (g.subs||[]).forEach(s=>{
      const sc = countArr(s.items);
      body += `<div class="sub">
        <div class="sub-head">
          <span class="sub-title">${escapeHtml(s.name)}</span>
          <span class="badge">${sc.done}/${sc.total}</span>
          <span class="sdel" data-sdel="${s.id}" title="删除子分组">🗑</span>
        </div>
        ${renderItems(s.items, s.id)}
      </div>`;
    });
    body += `<button class="addsub" data-addsub="${g.id}">+ 添加子分组</button>`;
    return `<div class="group" data-g="${g.id}">
      <div class="group-head">
        <span class="title">${escapeHtml(g.name)}</span>
        <span class="badge">${c.done}/${c.total}</span>
        <span class="gdel" data-gdel="${g.id}" title="删除整个阶段">🗑</span>
      </div>
      <div class="group-body">${body}</div>
    </div>`;
  }).join("");
  return html + `<button class="addgroup" data-addgroup="${tabId}">+ 新增一个阶段</button>`;
}

  const rows = store.budget.map((b)=>{
    return `<tr data-brow="${b.id}">

function renderTips(){

function escapeHtml(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}
function escapeAttr(s){return String(s).replace(/"/g,"&quot;");}

/* ---------- 查找 ---------- */
function findItem(id){
  for(const tab of CHECK_TABS){
    for(const g of store.data[tab].groups){
      let it = (g.items||[]).find(x=>x.id===id);
      if(it) return {arr:g.items, it};
      for(const s of (g.subs||[])){
        it = s.items.find(x=>x.id===id);
        if(it) return {arr:s.items, it};
      }
    }
  }
  return null;
}
function findGroup(id){
  for(const tab of CHECK_TABS){
    const g = store.data[tab].groups.find(x=>x.id===id);
    if(g) return {tab, g, groups: store.data[tab].groups};
  }
  return null;
}
function findSub(id){
  for(const tab of CHECK_TABS){
    for(const g of store.data[tab].groups){
      const s = (g.subs||[]).find(x=>x.id===id);
      if(s) return {g, s};
    }
  }
  return null;
}
// 添加项的容器可能是一级阶段(直接项)或二级子分组
function findContainer(id){
  for(const tab of CHECK_TABS){
    for(const g of store.data[tab].groups){
      if(g.id===id){ if(!g.items) g.items=[]; return g.items; }
      for(const s of (g.subs||[])){
        if(s.id===id) return s.items;
      }
    }
  }
  return null;
}

/* ---------- 事件 ---------- */
function bindEvents(){
  // 勾选
  document.querySelectorAll(".cb").forEach(cb=>{
    cb.onchange = ()=>{ const f=findItem(cb.dataset.id); if(f){f.it.done=cb.checked; save(); render();} };
  });
  // 点文字也可勾选
  document.querySelectorAll("[data-toggle]").forEach(el=>{
    el.onclick = ()=>{ const f=findItem(el.dataset.toggle); if(f){f.it.done=!f.it.done; save(); render();} };
  });
  // 编辑备注
  document.querySelectorAll("[data-edit]").forEach(el=>{
    el.onclick = ()=>{
      const f=findItem(el.dataset.edit);
      if(!f) return;
      const v=prompt("备注(留空可清除):", f.it.note||"");
      if(v===null) return;
      const t=v.trim();
      if(t) f.it.note=t; else delete f.it.note;
      save(); render();
    };
  });
  // 切换负责人
  document.querySelectorAll("[data-who]").forEach(el=>{
    el.onclick = ()=>{ const f=findItem(el.dataset.who); if(f){f.it.who=nextWho(f.it.who); save(); render();} };
  });
  // 删除项
  document.querySelectorAll("[data-del]").forEach(el=>{
    el.onclick = ()=>{
      const f=findItem(el.dataset.del);
      if(f){ const i=f.arr.findIndex(x=>x.id===el.dataset.del); if(i>-1) f.arr.splice(i,1); save(); render(); }
    };
  });
  // 添加项(按钮 + 回车)
  document.querySelectorAll("[data-addbtn]").forEach(btn=>{
    btn.onclick = ()=>addItem(btn.dataset.addbtn);
  });
  document.querySelectorAll("[data-addinput]").forEach(inp=>{
    inp.onkeydown = (e)=>{ if(e.key==="Enter") addItem(inp.dataset.addinput); };
  });
  // 删除一级阶段
  document.querySelectorAll("[data-gdel]").forEach(el=>{
    el.onclick = ()=>{
      const f=findGroup(el.dataset.gdel);
      if(f && confirm(`删除阶段「${f.g.name}」及其中所有内容?`)){
        f.groups.splice(f.groups.findIndex(x=>x.id===el.dataset.gdel),1);
        save(); render();
      }
    };
  });
  // 新增一级阶段
  document.querySelectorAll("[data-addgroup]").forEach(btn=>{
    btn.onclick = ()=>{
      const tab = btn.dataset.addgroup;
      const name = prompt("新阶段/分组名称:");
      if(name && name.trim()){
        store.data[tab].groups.push({id:uid(), name:name.trim(), items:[], subs:[]});
        save(); render();
      }
    };
  });
  // 新增二级子分组
  document.querySelectorAll("[data-addsub]").forEach(btn=>{
    btn.onclick = ()=>{
      const f=findGroup(btn.dataset.addsub);
      if(!f) return;
      const name=prompt("子分组名称:");
      if(name && name.trim()){
        if(!f.g.subs) f.g.subs=[];
        f.g.subs.push({id:uid(), name:name.trim(), items:[]});
        save(); render();
      }
    };
  });
  // 删除二级子分组
  document.querySelectorAll("[data-sdel]").forEach(el=>{
    el.onclick = ()=>{
      const f=findSub(el.dataset.sdel);
      if(f && confirm(`删除子分组「${f.s.name}」及其中所有项?`)){
        f.g.subs.splice(f.g.subs.findIndex(x=>x.id===el.dataset.sdel),1);
        save(); render();
      }
    };
  });

  // 注意事项:新增 / 编辑 / 删除
  document.querySelectorAll("[data-tipadd]").forEach(btn=>{
    btn.onclick = ()=>{
      const h=prompt("注意事项标题:");
      if(!h || !h.trim()) return;
      const c=prompt("具体内容:","");
      store.tips.push({id:uid(), h:h.trim(), c:(c||"").trim()});
      save(); render();
    };
  });
  document.querySelectorAll("[data-tipedit]").forEach(el=>{
    el.onclick = ()=>{
      const t=store.tips.find(x=>x.id===el.dataset.tipedit);
      if(!t) return;
      const h=prompt("标题:", t.h);
      if(h===null) return;
      const c=prompt("内容:", t.c);
      if(c===null) return;
      t.h=h.trim(); t.c=c.trim();
      save(); render();
    };
  });
  document.querySelectorAll("[data-tipdel]").forEach(el=>{
    el.onclick = ()=>{
      const t=store.tips.find(x=>x.id===el.dataset.tipdel);
      if(t && confirm(`删除「${t.h}」?`)){
        store.tips = store.tips.filter(x=>x.id!==el.dataset.tipdel);
        save(); render();
      }
    };
  });

  // 预算:改名 / 预算 / 实际 / 删除 / 新增
  document.querySelectorAll("[data-bname]").forEach(inp=>{
    inp.oninput = ()=>{ const b=store.budget.find(x=>x.id===inp.dataset.bname); if(b){b.name=inp.value; save();} };
  });
  document.querySelectorAll("[data-bplan]").forEach(inp=>{
    inp.oninput = ()=>{ const b=store.budget.find(x=>x.id===inp.dataset.bplan); if(b){b.plan=inp.value===""?0:Number(inp.value); save(); updateBudgetTotal();} };
  });
  document.querySelectorAll("[data-bactual]").forEach(inp=>{
    inp.oninput = ()=>{ const b=store.budget.find(x=>x.id===inp.dataset.bactual); if(b){b.actual=inp.value===""?"":Number(inp.value); save(); updateBudgetTotal();} };
  });
  document.querySelectorAll("[data-bdel]").forEach(el=>{
    el.onclick = ()=>{ store.budget = store.budget.filter(x=>x.id!==el.dataset.bdel); save(); render(); };
  });
  document.querySelectorAll("[data-baddrow]").forEach(btn=>{
    btn.onclick = ()=>{ store.budget.push({id:uid(), name:"新项目", plan:0, actual:""}); save(); render(); };
  });

  if(active==="budget") updateBudgetTotal();
}

function addItem(containerId){
  const inp = document.querySelector(`[data-addinput="${containerId}"]`);
  if(!inp) return;
  const val = inp.value.trim();
  if(!val) return;
  const arr = findContainer(containerId);
  if(arr){ arr.push({id:uid(), t:val, who:"both", done:false}); save(); render(); }
}

function updateBudgetTotal(){
  const planTotal = store.budget.reduce((s,b)=>s+(Number(b.plan)||0),0);
  let actualTotal = 0;
  store.budget.forEach(b=>{ if(typeof b.actual==="number") actualTotal+=b.actual; });
  const pt = document.getElementById("planTotal");
  const at = document.getElementById("actualTotal");
  if(pt) pt.textContent = planTotal.toLocaleString();
  if(at) at.textContent = actualTotal.toLocaleString();
}

function updateProgress(){
  let total=0, done=0;
  PROGRESS_TABS.forEach(tab=>{
    store.data[tab].groups.forEach(g=>{
      (g.items||[]).forEach(it=>{ total++; if(it.done) done++; });
      (g.subs||[]).forEach(s=>{ s.items.forEach(it=>{ total++; if(it.done) done++; }); });
    });
  });
  const pct = total? Math.round(done/total*100):0;
  document.getElementById("progressBar").style.width = pct+"%";
  document.getElementById("doneCount").textContent = done;
  document.getElementById("totalCount").textContent = total;
  document.getElementById("progressPct").textContent = pct+"%";
}

document.getElementById("resetBtn").onclick = ()=>{
  if(confirm("确定恢复默认清单吗?你添加/删除/勾选的内容都会清空。")){
    store = buildDefault();
    save();
    render();
  }
};

renderCountdown();
render();

/* ---------- 同步初始化 ---------- */
setSyncUI("ok","云端同步已开启");
startPolling();
pullNow(); // 打开页面先拉一次云端数据
// 回到前台时立刻拉一次,减少等待
document.addEventListener("visibilitychange", ()=>{
  if(!document.hidden) pullNow();
});
</script>
</body>
</html>
